version: '3.8'

services:

  # ─── LINK 7: ZooKeeper (Cluster Manager & Coordinator) ───
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # ─── LINK 2: Kafka (Message Broker & Central Bus) ───
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ─── LINK 1: High-Speed Ingestion Engine (API Extractor & Telemetry Producer) ───
  ingestion-service:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: ingestion-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CASSANDRA_HOST=cassandra
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./ingestion:/app
    depends_on:
      - kafka
      - cassandra

  # ─── LINK 3 & LINK 4 BRIDGE: Stream Processor (Kafka ➔ Real-time Analytics ➔ Cassandra) ───
  stream-processor:
    build:
      context: ./processor
      dockerfile: Dockerfile
    container_name: stream-processor
    restart: always
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CASSANDRA_HOST=cassandra
    volumes:
      - ./data:/app/data
      - ./processor:/app
    depends_on:
      - kafka
      - cassandra

  # ─── LINK 3b: Flink JobManager (Real-time Stream Engine) ───
  flink-jobmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: flink-jobmanager
    ports:
      - "8001:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"

  flink-taskmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"

  # ─── LINK 3a: Spark Master (Big Data Analytics) ───
  spark:
    image: apache/spark:latest
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"   # Spark Web UI
      - "7077:7077"   # Spark Master
    environment:
      SPARK_MODE: master

  # ─── LINK 4: Cassandra (NoSQL Filing Cabinet Database) ───
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "RailwayCluster"
    volumes:
      - cassandra-data:/var/lib/cassandra

  # ─── LINK 5: Grafana (Control Room TV Dashboard) ───
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123

volumes:
  cassandra-data:
